<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111112">
<title>Pitwall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Montserrat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><img class="logo" src="/img/cb-sprint-amber.svg" alt=""><b>PITWALL</b></div>
    <div class="series" id="series"></div>
    <div class="trk">
      <div class="trk-name" id="trk-name">Waiting for iRacing…</div>
      <div class="trk-sub" id="trk-sub"></div>
    </div>
    <div class="clock">
      <div class="clock-main" id="clock-main">--:--:--</div>
      <div class="clock-sub" id="clock-sub"></div>
    </div>
    <div class="spacer"></div>
    <div class="hstat"><small>SOF</small><b id="sof">–</b></div>
    <span class="conn" id="conn" title="Connection"><i></i><em>offline</em></span>
  </header>
  <main class="board" id="board"></main>
  <button class="fs-btn" id="fs-btn" title="Full screen" aria-label="Toggle full screen"></button>
  <div class="overlay" id="overlay">
    <div class="ov-card">
      <div class="ov-ring"></div>
      <h2 id="ov-title">Waiting for iRacing</h2>
      <p id="ov-text">Start iRacing and load into a session. The dashboard connects on its own.</p>
    </div>
  </div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
